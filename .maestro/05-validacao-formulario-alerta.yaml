appId: ${APP_ID:-com.rocketseat.cryptoalert}
name: "E2E-05: Validacao de Campos Obrigatorios na Criacao de Alerta"
tags:
  - alertas
  - validacao
---
- launchApp:
    clearState: false

# Navega para a criacao de alerta
- tapOn: "Alerts"
- tapOn:
    text: "(New Alert|Create Alert)"
- assertVisible: "Create Alert"

# O botao Save Alert permanece inativo / nao submete sem os campos obrigatorios
- tapOn: "Save Alert"
- assertVisible: "Create Alert"

# Preenche apenas o preco sem selecionar a moeda
- tapOn:
    text: "0.00"
- inputText: "50000"
- hideKeyboard
- tapOn: "Save Alert"

# Permanece na mesma tela pois a criptomoeda e campo obrigatorio
- assertVisible: "Create Alert"

# Retorna para a tela anterior pelo botao de voltar acessivel
- tapOn:
    accessibilityLabel: "Go back"
- assertVisible: "Price Alerts"
